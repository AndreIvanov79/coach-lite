# GitHub Pages for the Mini App: copy this file to .github/workflows/pages.yml in the coach-lite repository,
# then Settings → Pages → Source: GitHub Actions. Every push to main runs the tests and publishes miniapp/dist
# at https://<user>.github.io/coach-lite/ (the URL to set as the bot's Main Mini App in BotFather).
name: Mini App on GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: miniapp/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
